<!DOCTYPE html>
<html lang="en">
<head>
    <style>
@view-transition { navigation: auto; }
::view-transition-old(shutter) {
   animation: shutter-in 1500ms var(--ease-start) forwards 1;
   mix-blend-mode: normal;
}
::view-transition-old(nav) {
   animation: nav-slide-out 1000ms var(--ease-start) forwards 1;
   mix-blend-mode: normal;
   z-index: 10;
}
::view-transition-new(nav) {
   transform: translateX(100%);
   animation: nav-slide-in 500ms var(--ease-start) forwards 1 1000ms;
   mix-blend-mode: normal;
}
::view-transition-old(cards) {
   animation: cards-slide-out 1000ms var(--ease-start) forwards 1;
   mix-blend-mode: normal;
   z-index: 10;
}
::view-transition-new(cards) {
   transform: translateX(-100%);
   animation: cards-slide-in 500ms var(--ease-start) forwards 1 1000ms;
   mix-blend-mode: normal;
}
@keyframes nav-slide-out {  
   to { transform: translateX(-100%); }
}
@keyframes nav-slide-in {  
   to { transform: translateX(0%); }
}
@keyframes cards-slide-out {
   to { transform: translateX(100%); }
}
@keyframes cards-slide-in {
    from { transform: translateX(100%); }
   to { transform: translateX(0%); }
}
@keyframes shutter-in {
   0% { transform: translateY(0%); }
   50% { transform: translateY(100%); }
   100% { transform: translateY(0%); }
}
@keyframes shutter-out {
   from { transform: translateY(100%); }
   to { transform: translateY(0%); }
}

nav { view-transition-name: nav; }
#shutter { view-transition-name: shutter; }
.card-container { view-transition-name: cards; }
   </style>
